name: Trendyol yorumlarini guncelle

on:
  schedule:
    - cron: "17 3 * * 1"   # Her pazartesi 06:17 (Turkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yorumlari cek
        run: python scripts/fetch_reviews.py
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "yorum-bot"
          git config user.email "yorum-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Yorumlar guncellendi $(date +%F)"
          git push
